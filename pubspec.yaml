name: gsr_app
description: "GsrApp - Application de Gestion des Salles de Réunion et des Réservations."
publish_to: 'none'

version: 1.2.0+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  provider: ^6.1.5
  flutter_hooks: ^0.20.5
  intl: ^0.20.2
  shared_preferences: ^2.3.3
  fl_chart: ^1.2.0
  package_info_plus: ^10.2.1
  flutter_secure_storage: ^11.2.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_messaging: ^16.7.0
  file_picker: ^13.1.0
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
